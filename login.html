<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Access - Energy Transfer EDU</title>
  <style>
    :root {
      --bg-dark: #070a14;
      --card-bg: rgba(17, 26, 46, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-yellow: #facc15;
      --accent-green: #4ade80;
      --accent-red: #ef4444;
      --border-color: rgba(56, 189, 248, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    /* ANIMATED BACKGROUND ORBS */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.4;
      animation: float 12s infinite alternate ease-in-out;
    }
    .orb-1 { width: 350px; height: 350px; background: #0284c7; top: -50px; left: -50px; }
    .orb-2 { width: 400px; height: 400px; background: #7e22ce; bottom: -100px; right: -50px; animation-delay: -6s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.1); }
    }

    /* LOGIN CARD (GLASSMORPHISM) */
    .auth-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.1);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-header h1 {
      font-size: 1.6rem;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }
    .brand-header p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 6px;
    }

    /* TAB SWITCHER */
    .tab-group {
      display: flex;
      background: rgba(11, 17, 32, 0.8);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .tab-btn.active {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* FORM STYLES */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent-cyan);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper input, .input-wrapper select {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .input-wrapper input:focus, .input-wrapper select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    /* ROLE SELECTOR CARDS FOR REGISTER */
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .role-option {
      background: #0b1120;
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .role-option:hover { border-color: var(--accent-cyan); }
    .role-option.selected {
      border-color: var(--accent-purple);
      background: rgba(192, 132, 252, 0.15);
    }
    .role-option span { display: block; font-size: 1.2rem; }
    .role-option p { font-size: 0.8rem; font-weight: bold; margin-top: 4px; }

    /* SUBMIT BUTTON */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #0284c7 100%);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      filter: brightness(1.15);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      transform: translateY(-1px);
    }

    /* STATUS NOTIFICATION BOX */
    .status-msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
    }
    .status-msg.error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); color: #fca5a5; }
    .status-msg.success { background: rgba(74, 222, 128, 0.15); border: 1px solid var(--accent-green); color: #86efac; }
  </style>
</head>
<body>

  <!-- BACKGROUND ANIMATED GLOWS -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- AUTHENTICATION CARD -->
  <div class="auth-card">
    <div class="brand-header">
      <h1>⚡ Energy Transfer EDU</h1>
      <p id="subheading">Access Cadet Terminal</p>
    </div>

    <!-- TABS -->
    <div class="tab-group">
      <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">Log In</button>
      <button class="tab-btn" id="tab-register" onclick="switchMode('register')">Register</button>
    </div>

    <form id="auth-form">
      <!-- REGISTER EXTRA FIELDS -->
      <div id="register-fields" style="display: none;">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="full-name" placeholder="Cadet Alex Vance">
          </div>
        </div>

        <div class="form-group">
          <label>Account Role</label>
          <div class="role-selector">
            <div class="role-option selected" id="role-student" onclick="selectRole('student')">
              <span>🎓</span>
              <p>Student</p>
            </div>
            <div class="role-option" id="role-teacher" onclick="selectRole('teacher')">
              <span>👨‍🏫</span>
              <p>Teacher</p>
            </div>
          </div>
        </div>
      </div>

      <!-- COMMON FIELDS -->
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="cadet@energy.edu" required>
        </div>
      </div>

      <div class="form-group">
        <label>Security Key (Password)</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Authorize Session 🚀</button>
    </form>

    <div class="status-msg" id="status-box"></div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';

    let currentMode = 'login';
    let selectedRole = 'student';

    window.switchMode = function(mode) {
      currentMode = mode;
      const loginTab = document.getElementById('tab-login');
      const regTab = document.getElementById('tab-register');
      const regFields = document.getElementById('register-fields');
      const submitBtn = document.getElementById('submit-btn');
      const subheading = document.getElementById('subheading');

      if (mode === 'login') {
        loginTab.classList.add('active');
        regTab.classList.remove('active');
        regFields.style.display = 'none';
        submitBtn.textContent = 'Authorize Session 🚀';
        subheading.textContent = 'Access Cadet Terminal';
      } else {
        regTab.classList.add('active');
        loginTab.classList.remove('active');
        regFields.style.display = 'block';
        submitBtn.textContent = 'Create Cadet Account ⚡';
        subheading.textContent = 'Initialize New Cadet Clearance';
      }
      hideStatus();
    };

    window.selectRole = function(role) {
      selectedRole = role;
      document.getElementById('role-student').classList.toggle('selected', role === 'student');
      document.getElementById('role-teacher').classList.toggle('selected', role === 'teacher');
    };

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing Authorization...';
      hideStatus();

      if (currentMode === 'login') {
        // LOGIN
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          showStatus(error.message, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Authorize Session 🚀';
          return;
        }

        // FETCH USER PROFILE TO DETERMINE ROUTE
        const { data: profile } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();

        showStatus('Access granted. Redirecting...', 'success');
        setTimeout(() => {
          if (profile && profile.role === 'teacher') {
            window.location.href = 'teacher/dashboard.html';
          } else {
            window.location.href = 'student/index.html';
          }
        }, 800);

      } else {
        // REGISTER
        const fullName = document.getElementById('full-name').value.trim();

        if (!fullName) {
          showStatus('Please enter your full name.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Cadet Account ⚡';
          return;
        }

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              role: selectedRole
            }
          }
        });

        if (error) {
          showStatus(error.message, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Cadet Account ⚡';
          return;
        }

        showStatus('Registration complete! Logging you in...', 'success');
        setTimeout(() => {
          if (selectedRole === 'teacher') {
            window.location.href = 'teacher/dashboard.html';
          } else {
            window.location.href = 'student/index.html';
          }
        }, 1200);
      }
    });

    function showStatus(message, type) {
      const box = document.getElementById('status-box');
      box.textContent = message;
      box.className = `status-msg ${type}`;
      box.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('status-box').style.display = 'none';
    }
  </script>
</body>
</html>
