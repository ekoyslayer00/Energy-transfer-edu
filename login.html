<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Access - Energy Transfer EDU</title>
  <style>
    :root {
      --bg-dark: #070a14;
      --card-bg: rgba(17, 26, 46, 0.75);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-green: #4ade80;
      --accent-red: #ef4444;
      --border-color: rgba(56, 189, 248, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 20px;
    }

    /* ANIMATED BACKGROUND ORBS */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.4;
      animation: float 12s infinite alternate ease-in-out;
    }
    .orb-1 { width: 350px; height: 350px; background: #0284c7; top: -50px; left: -50px; }
    .orb-2 { width: 400px; height: 400px; background: #7e22ce; bottom: -100px; right: -50px; animation-delay: -6s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.1); }
    }

    /* LOGIN CARD (GLASSMORPHISM) */
    .auth-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.1);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-header h1 {
      font-size: 1.6rem;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }
    .brand-header p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 6px;
    }

    /* FORM STYLES */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent-cyan);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrapper input {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .input-wrapper input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    /* SUBMIT BUTTON */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #0284c7 100%);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      filter: brightness(1.15);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      transform: translateY(-1px);
    }

    /* STATUS NOTIFICATION BOX */
    .status-msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
    }
    .status-msg.error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent-red); color: #fca5a5; }
    .status-msg.success { background: rgba(74, 222, 128, 0.15); border: 1px solid var(--accent-green); color: #86efac; }
  </style>
</head>
<body>

  <!-- BACKGROUND ANIMATED GLOWS -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- AUTHENTICATION CARD -->
  <div class="auth-card">
    <div class="brand-header">
      <h1>⚡ Energy Transfer EDU</h1>
      <p>Terminal Access Clearance</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="" required>
        </div>
      </div>

      <div class="form-group">
        <label>Security Key (Password)</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="" required>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Authorize Session 🚀</button>
    </form>

    <div class="status-msg" id="status-box"></div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying Authorization...';
      hideStatus();

      // SUPABASE LOGIN
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showStatus(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Authorize Session 🚀';
        return;
      }

      // FETCH USER ROLE FROM PROFILES
      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

      showStatus('Access Granted. Redirecting...', 'success');

      setTimeout(() => {
        if (profile && profile.role === 'teacher') {
          window.location.href = 'teacher/dashboard.html';
        } else {
          window.location.href = 'student/index.html';
        }
      }, 800);
    });

    function showStatus(message, type) {
      const box = document.getElementById('status-box');
      box.textContent = message;
      box.className = `status-msg ${type}`;
      box.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('status-box').style.display = 'none';
    }
  </script>
</body>
</html>
