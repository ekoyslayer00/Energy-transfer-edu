<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Teacher Dashboard</h1>
            <button id="logout-btn" style="width: auto; background: #EF4444;">Log Out</button>
        </div>
        
        <hr style="margin: 2rem 0;">

        <!-- SECTION 1: Create a Quiz -->
        <h2>1. Create a New Quiz</h2>
        <form id="create-quiz-form" style="display: flex; gap: 1rem;">
            <input type="text" id="quiz-title" placeholder="e.g., Thermal Energy Basics" required style="margin: 0;">
            <button type="submit" style="width: auto;">Create Quiz</button>
        </form>
        <p id="quiz-msg" style="color: green; display: none;">Quiz created successfully!</p>

        <hr style="margin: 2rem 0;">

        <!-- SECTION 2: Add Questions -->
        <h2>2. Add Questions to Quiz</h2>
        <form id="add-question-form">
            <label for="quiz-select">Select Quiz</label>
            <select id="quiz-select" required style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">Loading quizzes...</option>
            </select>

            <label for="question-type">Question Type</label>
            <select id="question-type" required style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px;">
                <option value="poll">Poll (Multiple Choice)</option>
                <option value="drag_drop">Drag & Drop</option>
                <option value="connect_the_dot">Connect the Dots</option>
            </select>

            <!-- DYNAMIC FIELDS: Poll -->
            <div id="fields-poll" class="type-fields" style="display: block; background: #F9FAFB; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                <label>Question Text</label>
                <input type="text" id="poll-q" placeholder="What is conduction?">
                
                <label>Options (Comma separated)</label>
                <input type="text" id="poll-opts" placeholder="Heat transfer by touch, Heat transfer by light, ...">
                
                <label>Correct Option Index (0 = first option, 1 = second, etc.)</label>
                <input type="number" id="poll-ans" min="0" max="3" value="0">
            </div>

            <!-- DYNAMIC FIELDS: Drag & Drop / Connect the Dots -->
            <!-- We use textareas here so you can paste the raw JSON structure for these complex mechanics -->
            <div id="fields-complex" class="type-fields" style="display: none; background: #F9FAFB; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                <p style="font-size: 0.9rem; color: #666;">For Drag & Drop and Connect the Dots, define the data structures in JSON.</p>
                
                <label>Content JSON (Instructions, items, dots, etc.)</label>
                <textarea id="complex-content" rows="4" style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; font-family: monospace;" placeholder='{"instruction": "Match the terms"}'></textarea>
                
                <label>Correct Answer JSON (Mappings, coordinate pairs, etc.)</label>
                <textarea id="complex-ans" rows="4" style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; font-family: monospace;" placeholder='{"matches": {"A":"B"}}'></textarea>
            </div>

            <button type="submit">Save Question</button>
        </form>
        <p id="question-msg" style="color: green; display: none;">Question added successfully!</p>
    </div>

    <script type="module" src="../js/teacher.js"></script>
</body>
</html>
