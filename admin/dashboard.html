<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Energy Transfer EDU</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 25px; }
    header h1 { font-size: 1.5rem; color: var(--accent-blue); }
    .user-info { display: flex; align-items: center; gap: 15px; }
    .role-badge { background: var(--accent-purple); color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    .btn-logout { background: var(--accent-red); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .btn-logout:hover { opacity: 0.8; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); text-align: center; }
    .stat-card h3 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
    .stat-card p { font-size: 2rem; font-weight: bold; color: var(--accent-blue); }

    .content-section { background: var(--card-bg); padding: 25px; border-radius: 10px; border: 1px solid var(--border-color); }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .section-header h2 { font-size: 1.2rem; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
    th { background: #0f172a; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
    tr:hover { background: rgba(255, 255, 255, 0.02); }

    select.role-select { background: #0f172a; color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 5px; outline: none; cursor: pointer; }
    .btn-delete { background: var(--accent-red); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .btn-delete:hover { opacity: 0.8; }

    #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; z-index: 1000; }
  </style>
</head>
<body>

  <div id="loading-overlay">Verifying Admin Access...</div>

  <header>
    <h1>⚡ Admin Dashboard</h1>
    <div class="user-info">
      <span id="user-email">admin@game.com</span>
      <span class="role-badge">Admin</span>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </div>
  </header>

  <main>
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Registered Users</h3>
        <p id="stat-total-users">0</p>
      </div>
      <div class="stat-card">
        <h3>Teachers</h3>
        <p id="stat-teachers" style="color: var(--accent-green);">0</p>
      </div>
      <div class="stat-card">
        <h3>Students</h3>
        <p id="stat-students">0</p>
      </div>
      <div class="stat-card">
        <h3>Administrators</h3>
        <p id="stat-admins" style="color: var(--accent-purple);">0</p>
      </div>
    </div>

    <section class="content-section">
      <div class="section-header">
        <h2>User Management</h2>
        <button id="refresh-btn" style="background: var(--accent-blue); color: #000; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold;">Refresh List</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Full Name</th>
            <th>User ID</th>
            <th>Created Date</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script type="module">
    import { supabase } from '../js/supabase.js';

    let currentUser = null;

    // Check Authentication & Role Protection
    async function initAdminPage() {
      const { data: { session }, error } = await supabase.auth.getSession();

      if (!session) {
        window.location.href = '../login.html';
        return;
      }

      currentUser = session.user;

      // Verify Admin Role from profiles table
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('role, full_name')
        .eq('id', currentUser.id)
        .single();

      if (profileError || !profile || profile.role !== 'admin') {
        alert('Access Denied: Admin Privileges Required.');
        window.location.href = '../login.html';
        return;
      }

      document.getElementById('user-email').textContent = currentUser.email;
      document.getElementById('loading-overlay').style.display = 'none';

      await loadUsers();
    }

    // Load All Users from Profiles Table
    async function loadUsers() {
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Fetching profiles...</td></tr>';

      const { data: profiles, error } = await supabase
        .from('profiles')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error fetching users:', error);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--accent-red);">Error loading users: ${error.message}</td></tr>`;
        return;
      }

      // Update Statistics
      document.getElementById('stat-total-users').textContent = profiles.length;
      document.getElementById('stat-teachers').textContent = profiles.filter(p => p.role === 'teacher').length;
      document.getElementById('stat-students').textContent = profiles.filter(p => p.role === 'student').length;
      document.getElementById('stat-admins').textContent = profiles.filter(p => p.role === 'admin').length;

      // Render Rows
      tbody.innerHTML = '';
      profiles.forEach(user => {
        const tr = document.createElement('tr');
        const formattedDate = new Date(user.created_at).toLocaleDateString();

        tr.innerHTML = `
          <td><strong>${user.full_name || 'N/A'}</strong></td>
          <td style="font-family: monospace; font-size: 0.85rem; color: var(--text-muted);">${user.id}</td>
          <td>${formattedDate}</td>
          <td>
            <select class="role-select" data-userid="${user.id}">
              <option value="student" ${user.role === 'student' ? 'selected' : ''}>Student</option>
              <option value="teacher" ${user.role === 'teacher' ? 'selected' : ''}>Teacher</option>
              <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
          </td>
          <td>
            <button class="btn-delete" data-userid="${user.id}">Delete Profile</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Attach Event Listeners to Dropdowns & Delete Buttons
      document.querySelectorAll('.role-select').forEach(select => {
        select.addEventListener('change', handleRoleChange);
      });

      document.querySelectorAll('.btn-delete').forEach(button => {
        button.addEventListener('click', handleDeleteUser);
      });
    }

    // Handle Role Update
    async function handleRoleChange(e) {
      const userId = e.target.getAttribute('data-userid');
      const newRole = e.target.value;

      const { error } = await supabase
        .from('profiles')
        .update({ role: newRole })
        .eq('id', userId);

      if (error) {
        alert('Failed to update user role: ' + error.message);
        loadUsers(); // Reset UI
      } else {
        alert(`User role updated to "${newRole}" successfully.`);
        loadUsers();
      }
    }

    // Handle User Profile Deletion
    async function handleDeleteUser(e) {
      const userId = e.target.getAttribute('data-userid');

      if (userId === currentUser.id) {
        alert('You cannot delete your own admin account from here.');
        return;
      }

      if (!confirm('Are you sure you want to delete this user profile?')) return;

      const { error } = await supabase
        .from('profiles')
        .delete()
        .eq('id', userId);

      if (error) {
        alert('Error deleting user: ' + error.message);
      } else {
        alert('User profile removed.');
        loadUsers();
      }
    }

    // Logout Action
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '../login.html';
    });

    document.getElementById('refresh-btn').addEventListener('click', loadUsers);

    // Initialize page
    initAdminPage();
  </script>
</body>
</html>
