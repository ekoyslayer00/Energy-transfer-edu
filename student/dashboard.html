<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Energy Transfer EDU</title>
  <style>
    :root {
      --bg-dark: #0b1329;
      --card-bg: #162238;
      --card-hover: #1e2d4a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-green: #4ade80;
      --accent-purple: #c084fc;
      --accent-orange: #fb923c;
      --accent-yellow: #facc15;
      --border-color: #243452;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 24px; }

    /* GAMIFIED HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      margin-bottom: 30px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { font-size: 1.4rem; color: var(--accent-cyan); letter-spacing: 0.5px; }

    .student-hud { display: flex; align-items: center; gap: 20px; }
    .hud-chip {
      background: #0f172a;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-chip.xp { color: var(--accent-yellow); border-color: rgba(250, 204, 21, 0.3); }
    .hud-chip.streak { color: var(--accent-orange); border-color: rgba(251, 146, 60, 0.3); }
    .hud-chip.level { color: var(--accent-purple); border-color: rgba(192, 132, 252, 0.3); }

    .btn-logout {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-logout:hover { opacity: 0.85; transform: translateY(-1px); }

    /* HERO WELCOME */
    .hero-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #1e293b 100%);
      border: 1px solid rgba(192, 132, 252, 0.2);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .hero-banner::after {
      content: '⚡';
      position: absolute;
      right: 30px;
      font-size: 8rem;
      opacity: 0.08;
      pointer-events: none;
    }
    .hero-text h2 { font-size: 1.8rem; margin-bottom: 8px; color: var(--text-main); }
    .hero-text p { color: var(--text-muted); font-size: 1rem; }

    /* MISSIONS GRID */
    .section-title {
      font-size: 1.3rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-cyan);
    }

    .missions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .mission-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
    }
    .mission-card:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      box-shadow: 0 12px 30px -10px rgba(56, 189, 248, 0.2);
    }

    .mission-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .mission-icon {
      font-size: 2rem;
      background: rgba(56, 189, 248, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-xp {
      background: rgba(250, 204, 21, 0.15);
      color: var(--accent-yellow);
      border: 1px solid rgba(250, 204, 21, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .mission-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; }
    .mission-desc { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 20px; line-height: 1.4; }

    .btn-launch {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #0284c7 100%);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: all 0.2s;
    }
    .btn-launch:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    #loading-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">Loading Energy Missions...</div>

  <header>
    <div class="brand">
      <h1>⚡ Energy Transfer EDU</h1>
    </div>
    <div class="student-hud">
      <div class="hud-chip streak">🔥 <span id="user-streak">1</span> Day Streak</div>
      <div class="hud-chip xp">⭐ <span id="user-xp">150</span> XP</div>
      <div class="hud-chip level">🛡️ Level <span id="user-level">1</span></div>
      <button class="btn-logout" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <div class="hero-banner">
      <div class="hero-text">
        <h2>Welcome back, <span id="student-name" style="color: var(--accent-cyan);">Cadet</span>! 👋</h2>
        <p>Choose an Energy Transfer mission below to test your knowledge and earn XP.</p>
      </div>
    </div>

    <h3 class="section-title">🚀 Available Missions</h3>
    <div class="missions-grid" id="missions-container">
      <!-- Mission cards populated dynamically -->
    </div>
  </main>

  <script type="module">
    import { supabase } from '../js/supabase.js';

    let currentUser = null;

    async function initStudentPortal() {
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        window.location.href = '../login.html';
        return;
      }

      currentUser = session.user;

      // Fetch Profile Details
      const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (profile) {
        document.getElementById('student-name').textContent = profile.full_name || currentUser.email.split('@')[0];
        document.getElementById('user-xp').textContent = profile.xp ?? 150;
        document.getElementById('user-streak').textContent = profile.streak ?? 1;
        document.getElementById('user-level').textContent = profile.level ?? 1;
      }

      document.getElementById('loading-overlay').style.display = 'none';

      await loadMissions();
    }

    async function loadMissions() {
      const container = document.getElementById('missions-container');
      container.innerHTML = '<p style="color: var(--text-muted);">Loading missions...</p>';

      const { data: quizzes, error } = await supabase
        .from('quizzes')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !quizzes || quizzes.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted);">No active energy missions available right now. Check back soon!</p>';
        return;
      }

      container.innerHTML = '';

      const icons = ['🔥', '⚡', '🌊', '☀️', '💡', '🧪'];

      quizzes.forEach((quiz, index) => {
        const icon = icons[index % icons.length];
        const card = document.createElement('div');
        card.className = 'mission-card';

        card.innerHTML = `
          <div>
            <div class="mission-header">
              <div class="mission-icon">${icon}</div>
              <span class="badge-xp">+100 XP</span>
            </div>
            <div class="mission-title">${quiz.title}</div>
            <div class="mission-desc">Master energy concepts and complete interactive challenges in this topic.</div>
          </div>
          <button class="btn-launch" onclick="startMission('${quiz.id}')">Start Mission 🚀</button>
        `;

        container.appendChild(card);
      });
    }

    window.startMission = function(quizId) {
      // Redirects directly to quiz.html with the selected quiz ID parameter
      window.location.href = `../quiz.html?quiz=${quizId}`;
    };

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '../login.html';
    });

    initStudentPortal();
  </script>
</body>
</html>
