<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

        <h1>Welcome, Student!</h1>

                <button onclick="window.location.href='quiz.html'" style="width: auto;">Start Quiz</button>

        <button id="logout-btn" style="margin-top: 3rem; background: #EF4444;">Log Out</button>
